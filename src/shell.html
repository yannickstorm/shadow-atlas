<div class="loading" id="loading"><div><div class="ring"></div><p>Charting the shadows…</p></div></div>
<div class="app" id="app">
  <header class="top gut">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13.2" fill="none" stroke="var(--accent)" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="1.6 3.1" stroke-linecap="round"/><circle cx="16" cy="16" r="9" fill="var(--accent)"/><circle cx="19.4" cy="13.8" r="8.4" fill="var(--surface)"/></svg><span class="brand-name">Shadow Atlas</span></div>
    <nav class="tabs" id="tabsTop" role="tablist" aria-label="Views"></nav>
    <div class="top-right">
      <div class="psearch"><svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="placeQ" type="search" placeholder="Search a place or lat, lon" autocomplete="off" aria-label="Search a place" role="combobox" aria-expanded="false" aria-controls="placeRes"><div class="psearch-res" id="placeRes" role="listbox" hidden></div></div>
      <div class="live-wrap"><button class="icon-btn" id="liveBtn" aria-label="Live street maps" title="Live street maps" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><i class="live-dot" hidden></i></button>
        <div class="menu glass live-pop" id="livePop" hidden></div></div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme" title="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    </div>
  </header>
  <aside class="rail rail-ev" aria-label="Eclipse catalogue">
    <div class="ev-panel" id="evPanel">
      <div class="rail-head"><h2>Eclipses</h2><span id="evCount"></span></div>
      <div class="filters" id="filters"></div>
      <div class="evlist" id="evList" role="listbox" aria-label="Eclipses"></div>
    </div>
  </aside>
  <main class="stage" id="stage">
    <section class="evhead gut" id="evHead" aria-live="polite"></section>
    <div class="panes" id="panes">
      <section class="pane" id="paneEarth" data-pane="earth" role="tabpanel"></section>
      <section class="pane" id="paneSky" data-pane="sky" role="tabpanel" hidden></section>
      <section class="pane" id="paneHorizon" data-pane="horizon" role="tabpanel" hidden></section>
      <section class="pane scroll" id="paneCharts" data-pane="charts" role="tabpanel" hidden></section>
      <section class="pane scroll" id="panePlan" data-pane="plan" role="tabpanel" hidden><div class="gut" id="inspCard" style="padding-top:14px"><section class="card"><div id="inspSlot"></div></section></div><div id="planBody"></div></section>
      <section class="pane" id="paneEvents" data-pane="events" role="tabpanel" hidden></section>
    </div>
  </main>
  <aside class="rail rail-site" id="railSite" aria-label="Your site"><div id="inspector"></div></aside>
  <nav class="bottomnav" id="tabsBottom" role="tablist" aria-label="Views"></nav>
</div>
