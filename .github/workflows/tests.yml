name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: node tools/build.js _site
      - name: Shadow Atlas (headless Chrome, online services replaced by local stand-ins)
        env:
          CHROME: /usr/bin/google-chrome
        run: node tests/test_app.js
